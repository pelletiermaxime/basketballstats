name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check (lint + format + typecheck)
        run: vp check

      - name: Test
        run: vp test run
